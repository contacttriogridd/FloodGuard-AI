# LightGBM search space (Optuna). Types: int | float | categorical; log: true for log-uniform.
learning_rate: {type: float, low: 0.01, high: 0.1, log: true}
num_leaves: {type: int, low: 15, high: 255}
feature_fraction: {type: float, low: 0.3, high: 1.0}
bagging_fraction: {type: float, low: 0.5, high: 1.0}
bagging_freq: {type: int, low: 1, high: 7}
lambda_l1: {type: float, low: 1.0e-8, high: 10.0, log: true}
lambda_l2: {type: float, low: 1.0e-8, high: 10.0, log: true}
min_child_samples: {type: int, low: 5, high: 200}
